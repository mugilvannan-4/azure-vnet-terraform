name: "Generate module docs"

on:
  push:
    branches: [main]
    paths:
      - "modules/**/*.tf"

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render terraform-docs into modules/vnet/README.md
        uses: terraform-docs/gh-actions@v1.3.0
        with:
          working-dir: modules/vnet
          output-file: README.md
          output-method: inject
          git-push: "true"
          git-commit-message: "docs: update module README [skip ci]"
